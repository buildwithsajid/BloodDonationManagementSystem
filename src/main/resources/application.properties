spring.application.name=BloodDonationManagementSystem

# PostgreSQL (Neon) Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_donation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSP View Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Server
server.port=${PORT:8080}

# Behind the Vercel proxy: keep redirects relative and session id in cookie only
server.tomcat.use-relative-redirects=true
server.servlet.session.tracking-modes=cookie
